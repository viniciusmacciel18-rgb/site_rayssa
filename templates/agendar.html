<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agendar horário | Rayssa Lima Nail Designer</title>

    <meta
        name="description"
        content="Agende seu horário com Rayssa Lima Nail Designer."
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- ==================================================
         CABEÇALHO
         ================================================== -->

    <header class="header">

        <div class="header-content">

            <a href="/" class="logo">

                Rayssa Lima

                <span>
                    Nail Designer
                </span>

            </a>


            <nav class="nav">

                <a href="/">
                    Início
                </a>

                <a href="/#servicos">
                    Serviços
                </a>

                <a href="/#sobre">
                    Sobre
                </a>

            </nav>

        </div>

    </header>



    <!-- ==================================================
         AGENDAMENTO
         ================================================== -->

    <main>

        <section class="booking-section">

            <div class="booking-container">


                <!-- TÍTULO -->

                <div class="section-heading">

                    <span class="eyebrow">
                        Seu momento começa aqui
                    </span>

                    <h1>
                        Agende seu horário
                    </h1>

                    <p>
                        Escolha o serviço, a data e o horário
                        que combinam com você.
                    </p>

                </div>



                <!-- FORMULÁRIO -->

                <form
                    action="/agendar"
                    method="POST"
                    class="booking-form"
                >


                    <!-- NOME -->

                    <div class="form-group">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            required
                        >

                    </div>



                    <!-- TELEFONE -->

                    <div class="form-group">

                        <label for="telefone">
                            WhatsApp / Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            required
                        >

                    </div>



                    <!-- SERVIÇO -->

                    <div class="form-group">

                        <label for="servico">
                            Serviço
                        </label>

                        <select
                            id="servico"
                            name="servico"
                            required
                        >

                            <option value="">
                                Selecione o serviço
                            </option>

                            <option value="Esmaltação simples">
                                Esmaltação simples — 30 min — R$ 30,00
                            </option>

                            <option value="Esmaltação em Gel">
                                Esmaltação em Gel — 90 min — R$ 50,00
                            </option>

                            <option value="Blindagem de unhas">
                                Blindagem de unhas — 60 min — R$ 30,00
                            </option>

                            <option value="Alongamento de unhas">
                                Alongamento de unhas — 120 min — R$ 60,00
                            </option>

                            <option value="Plano mensal">
                                Plano mensal — 90 min — R$ 150,00
                            </option>

                        </select>

                    </div>



                    <!-- DATA -->

                    <div class="form-group">

                        <label for="data">
                            Data
                        </label>

                        <input
                            type="date"
                            id="data"
                            name="data"
                            required
                        >

                    </div>



                    <!-- HORÁRIO -->

                    <div class="form-group">

                        <label for="horario">
                            Horário
                        </label>

                        <select
                            id="horario"
                            name="horario"
                            required
                        >

                            <option value="">
                                Primeiro escolha uma data
                            </option>

                        </select>

                    </div>



                    <!-- OBSERVAÇÕES -->

                    <div class="form-group">

                        <label for="observacoes">

                            Observações

                            <span>
                                (opcional)
                            </span>

                        </label>

                        <textarea
                            id="observacoes"
                            name="observacoes"
                            rows="4"
                            placeholder="Alguma informação importante para o seu atendimento?"
                        ></textarea>

                    </div>



                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="btn btn-primary booking-button"
                    >
                        Confirmar agendamento
                    </button>


                    <p class="booking-notice">

                        Após o envio, você verá a confirmação
                        do seu agendamento.

                    </p>


                </form>

            </div>

        </section>

    </main>



    <!-- ==================================================
         RODAPÉ
         ================================================== -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Rayssa Lima Nail Designer
            </p>

        </div>

    </footer>



    <!-- ==================================================
         HORÁRIOS
         ================================================== -->

    <script>


        const dataInput =
            document.getElementById("data");


        const horarioSelect =
            document.getElementById("horario");


        const servicoSelect =
            document.getElementById("servico");



        const duracoes = {

            "Esmaltação simples": 30,

            "Esmaltação em Gel": 90,

            "Blindagem de unhas": 60,

            "Alongamento de unhas": 120,

            "Plano mensal": 90

        };



        function criarHorarios(
            inicio,
            fim,
            duracao
        ) {

            const horarios = [];


            let atual = inicio;


            while (atual < fim) {

                const [hora, minuto] =
                    atual.split(":").map(Number);


                const minutos =
                    hora * 60 + minuto;


                const final =
                    minutos + duracao;


                const [fimHora, fimMinuto] =
                    fim.split(":").map(Number);


                const limite =
                    fimHora * 60 + fimMinuto;


                if (final <= limite) {

                    horarios.push(atual);

                }


                let proximo =
                    minutos + 30;


                const novaHora =
                    Math.floor(proximo / 60);


                const novoMinuto =
                    proximo % 60;


                atual =
                    String(novaHora).padStart(2, "0")
                    + ":"
                    + String(novoMinuto).padStart(2, "0");

            }


            return horarios;

        }



        async function atualizarHorarios() {

            horarioSelect.innerHTML = "";


            if (!dataInput.value) {

                const option =
                    document.createElement("option");


                option.value = "";


                option.textContent =
                    "Primeiro escolha uma data";


                horarioSelect.appendChild(option);


                return;

            }



            const servico =
                servicoSelect.value;


            if (!servico) {

                const option =
                    document.createElement("option");


                option.value = "";


                option.textContent =
                    "Primeiro escolha o serviço";


                horarioSelect.appendChild(option);


                return;

            }



            const duracao =
                duracoes[servico];



            const data =
                new Date(
                    dataInput.value + "T00:00:00"
                );



            const dia =
                data.getDay();



            let periodos = [];



            /*
                SEGUNDA, TERÇA,
                QUINTA E SEXTA
            */

            if (
                dia === 1 ||
                dia === 2 ||
                dia === 4 ||
                dia === 5
            ) {

                periodos = [

                    ["07:30", "11:00"],

                    ["13:30", "20:00"]

                ];

            }



            /*
                QUARTA-FEIRA
            */

            else if (dia === 3) {

                periodos = [

                    ["07:30", "11:00"],

                    ["13:30", "15:00"]

                ];

            }



            /*
                SÁBADO
            */

            else if (dia === 6) {

                periodos = [

                    ["09:00", "16:00"]

                ];

            }



            /*
                DOMINGO
            */

            else {

                const option =
                    document.createElement("option");


                option.value = "";


                option.textContent =
                    "Não há atendimento aos domingos";


                horarioSelect.appendChild(option);


                return;

            }



            /*
                CONSULTA OS BLOQUEIOS
                DO POSTGRESQL
            */

            let bloqueios = [];


            try {

                const resposta =
                    await fetch(
                        `/bloqueios/${dataInput.value}?t=${Date.now()}`,
                        {
                            cache: "no-store"
                        }
                    );


                if (resposta.ok) {

                    bloqueios =
                        await resposta.json();

                }

            }

            catch (erro) {

                console.error(
                    "Erro ao consultar bloqueios:",
                    erro
                );

            }



            /*
                DIA INTEIRO BLOQUEADO
            */

            if (
                bloqueios.includes("dia")
            ) {

                const option =
                    document.createElement("option");


                option.value = "";


                option.textContent =
                    "Não há horários disponíveis nesta data";


                horarioSelect.appendChild(option);


                return;

            }



            /*
                CRIA OS HORÁRIOS
                RESPEITANDO OS BLOQUEIOS
            */

            let horarios = [];


            periodos.forEach(
                periodo => {

                    const inicio =
                        periodo[0];


                    const fim =
                        periodo[1];



                    /*
                        IDENTIFICA SE O PERÍODO
                        ESTÁ BLOQUEADO
                    */

                    const bloqueadoManha =
                        inicio === "07:30"
                        &&
                        bloqueios.includes("manha");


                    const bloqueadoTarde =
                        inicio !== "07:30"
                        &&
                        bloqueios.includes("tarde");



                    if (
                        !bloqueadoManha
                        &&
                        !bloqueadoTarde
                    ) {

                        horarios.push(
                            ...criarHorarios(
                                inicio,
                                fim,
                                duracao
                            )
                        );

                    }

                }
            );



            /*
                REMOVE HORÁRIOS QUE JÁ PASSARAM
                QUANDO A DATA É HOJE
            */

            const hoje =
                new Date();


            const dataHoje =
                hoje.toISOString()
                    .split("T")[0];


            if (
                dataInput.value === dataHoje
            ) {

                const minutosAgora =
                    hoje.getHours() * 60
                    + hoje.getMinutes();


                horarios =
                    horarios.filter(
                        horario => {

                            const [h, m] =
                                horario
                                .split(":")
                                .map(Number);


                            return (
                                h * 60 + m
                                >= minutosAgora
                            );

                        }
                    );

            }



            /*
                NENHUM HORÁRIO DISPONÍVEL
            */

            if (
                horarios.length === 0
            ) {

                const option =
                    document.createElement("option");


                option.value = "";


                option.textContent =
                    "Nenhum horário disponível";


                horarioSelect.appendChild(option);


                return;

            }



            /*
                PRIMEIRA OPÇÃO
            */

            const primeira =
                document.createElement("option");


            primeira.value = "";


            primeira.textContent =
                "Selecione o horário";


            horarioSelect.appendChild(
                primeira
            );



            /*
                MOSTRA OS HORÁRIOS
            */

            horarios.forEach(
                horario => {

                    const option =
                        document.createElement("option");


                    option.value =
                        horario;


                    option.textContent =
                        horario;


                    horarioSelect.appendChild(
                        option
                    );

                }
            );

        }



        /*
            QUANDO ALTERAR A DATA
        */

        dataInput.addEventListener(
            "change",
            atualizarHorarios
        );



        /*
            QUANDO ALTERAR O SERVIÇO
        */

        servicoSelect.addEventListener(
            "change",
            atualizarHorarios
        );



        /*
            IMPEDE ESCOLHER DATAS ANTERIORES
        */

        const hoje =
            new Date();


        const ano =
            hoje.getFullYear();


        const mes =
            String(
                hoje.getMonth() + 1
            ).padStart(2, "0");


        const dia =
            String(
                hoje.getDate()
            ).padStart(2, "0");


        dataInput.min =
            `${ano}-${mes}-${dia}`;


    </script>


</body>

</html>
