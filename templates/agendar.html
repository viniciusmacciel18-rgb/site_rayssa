<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Agende seu horário com Rayssa Lima Nail Designer.">

    <title>Agendar horário | Rayssa Lima Nail Designer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="topo">

    <div class="container topo-conteudo">

        <a href="/" class="marca">
            <span class="marca-nome">Rayssa Lima</span>
            <span class="marca-subtitulo">Nail Designer</span>
        </a>

        <nav class="menu">
            <a href="/">Início</a>
            <a href="/#servicos">Serviços</a>
            <a href="/#sobre">Sobre</a>
            <a href="/agendar">Agendar</a>
        </nav>

    </div>

</header>


<main>

    <section class="pagina-agendamento">

        <div class="container">

            <div class="titulo-secao">

                <span>Agendamento</span>

                <h1>Reserve seu horário</h1>

                <p>
                    Escolha o serviço, a data e o horário
                    que melhor combinam com você.
                </p>

            </div>


            <form class="booking-form" method="POST" action="/agendar">

                <div class="campo">

                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefone">WhatsApp</label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="servico">Serviço</label>

                    <select id="servico" name="servico" required>

                        <option value="">
                            Selecione um serviço
                        </option>

                        <option value="Esmaltação simples" data-duracao="30">
                            Esmaltação simples — 30 min — R$ 30,00
                        </option>

                        <option value="Esmaltação em Gel" data-duracao="90">
                            Esmaltação em Gel — 90 min — R$ 45,00
                        </option>

                        <option value="Blindagem de unhas" data-duracao="60">
                            Blindagem de unhas — 60 min — R$ 30,00
                        </option>

                        <option value="Pedicure" data-duracao="45">
                            Pedicure — 45 min — R$ 30,00
                        </option>

                        <option value="Manicure + Pedicure" data-duracao="60">
                            Manicure + Pedicure — 60 min — R$ 50,00
                        </option>

                        <option value="Alongamento de unhas" data-duracao="120">
                            Alongamento de unhas — 120 min — R$ 60,00
                        </option>

                        <option value="Plano mensal" data-duracao="90">
                            Plano mensal — 90 min — R$ 150,00
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="data">Data</label>

                    <input
                        type="date"
                        id="data"
                        name="data"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="horario">Horário</label>

                    <select
                        id="horario"
                        name="horario"
                        required
                        disabled
                    >

                        <option value="">
                            Primeiro escolha o serviço e a data
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea
                        id="observacoes"
                        name="observacoes"
                        rows="4"
                        placeholder="Alguma observação? (opcional)"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="botao botao-principal botao-agendar"
                >
                    Confirmar agendamento
                </button>

            </form>

        </div>

    </section>

</main>


<footer class="rodape">

    <div class="container rodape-conteudo">

        <div>
            <strong>Rayssa Lima</strong>
            <span>Nail Designer</span>
        </div>

        <p>
            © 2026 Rayssa Lima Nail Designer
        </p>

    </div>

</footer>


<script>

const servico = document.getElementById("servico");
const data = document.getElementById("data");
const horario = document.getElementById("horario");


data.min = new Date().toISOString().split("T")[0];


function converterMinutos(hora) {

    const partes = hora.split(":");

    return parseInt(partes[0]) * 60 +
           parseInt(partes[1]);

}


function minutosParaHora(minutos) {

    const horas = Math.floor(minutos / 60);

    const minutosRestantes = minutos % 60;

    return String(horas).padStart(2, "0") +
           ":" +
           String(minutosRestantes).padStart(2, "0");

}


function atualizarHorarios() {

    horario.innerHTML = "";

    horario.disabled = true;


    if (!servico.value || !data.value) {

        const opcao = document.createElement("option");

        opcao.textContent =
            "Primeiro escolha o serviço e a data";

        opcao.value = "";

        horario.appendChild(opcao);

        return;

    }


    const dataEscolhida =
        new Date(data.value + "T00:00:00");

    const diaSemana =
        dataEscolhida.getDay();


    if (diaSemana === 0) {

        const opcao = document.createElement("option");

        opcao.textContent =
            "Domingo — fechado";

        opcao.value = "";

        horario.appendChild(opcao);

        return;

    }


    let periodos = [];


    if (
        diaSemana === 1 ||
        diaSemana === 2 ||
        diaSemana === 4 ||
        diaSemana === 5
    ) {

        periodos = [
            ["07:30", "11:00"],
            ["13:30", "20:00"]
        ];

    }


    else if (diaSemana === 3) {

        periodos = [
            ["07:30", "11:00"],
            ["13:30", "15:00"]
        ];

    }


    else if (diaSemana === 6) {

        periodos = [
            ["09:00", "16:00"]
        ];

    }


    const duracao =
        parseInt(
            servico.options[
                servico.selectedIndex
            ].dataset.duracao
        );


    const agora = new Date();

    const hoje =
        data.value ===
        agora.toISOString().split("T")[0];


    let encontrouHorario = false;


    periodos.forEach(function(periodo) {

        const inicio =
            converterMinutos(periodo[0]);

        const fim =
            converterMinutos(periodo[1]);


        for (
            let minuto = inicio;
            minuto + duracao <= fim;
            minuto += 30
        ) {

            if (hoje) {

                const horaAtual =
                    agora.getHours() * 60 +
                    agora.getMinutes();

                if (minuto < horaAtual) {
                    continue;
                }

            }


            const opcao =
                document.createElement("option");


            opcao.value =
                minutosParaHora(minuto);


            opcao.textContent =
                minutosParaHora(minuto);


            horario.appendChild(opcao);

            encontrouHorario = true;

        }

    });


    if (!encontrouHorario) {

        const opcao =
            document.createElement("option");

        opcao.value = "";

        opcao.textContent =
            "Não há horários disponíveis";

        horario.appendChild(opcao);

    }

    else {

        horario.disabled = false;

    }

}


servico.addEventListener(
    "change",
    atualizarHorarios
);


data.addEventListener(
    "change",
    atualizarHorarios
);

</script>

</body>

</html>
