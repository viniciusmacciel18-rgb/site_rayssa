<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agendar horário | Rayssa Lima Nail Designer</title>

    <meta
        name="description"
        content="Agende seu horário com Rayssa Lima Nail Designer."
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- ==================================================
         CABEÇALHO
         ================================================== -->

    <header class="header">

        <div class="header-content">

            <a href="/" class="logo">

                Rayssa Lima

                <span>
                    Nail Designer
                </span>

            </a>


            <nav class="nav">

                <a href="/">
                    Início
                </a>

                <a href="/#servicos">
                    Serviços
                </a>

                <a href="/#sobre">
                    Sobre
                </a>

            </nav>

        </div>

    </header>



    <!-- ==================================================
         AGENDAMENTO
         ================================================== -->

    <main>

        <section class="booking-section">

            <div class="booking-container">


                <!-- TÍTULO -->

                <div class="section-heading">

                    <span class="eyebrow">
                        Seu momento começa aqui
                    </span>

                    <h1>
                        Agende seu horário
                    </h1>

                    <p>
                        Escolha o serviço, a data e o horário
                        que combinam com você.
                    </p>

                </div>



                <!-- FORMULÁRIO -->

                <form
                    action="/agendar"
                    method="POST"
                    class="booking-form"
                >


                    <!-- NOME -->

                    <div class="form-group">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            required
                        >

                    </div>



                    <!-- TELEFONE -->

                    <div class="form-group">

                        <label for="telefone">
                            WhatsApp / Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            required
                        >

                    </div>



                    <!-- SERVIÇO -->

                    <div class="form-group">

                        <label for="servico">
                            Serviço
                        </label>

                        <select
                            id="servico"
                            name="servico"
                            required
                        >

                            <option value="">
                                Selecione o serviço
                            </option>

                            <option value="Esmaltação simples">
                                Esmaltação simples — 30 min — R$ 30,00
                            </option>

                            <option value="Esmaltação em Gel">
                                Esmaltação em Gel — 90 min — R$ 50,00
                            </option>

                            <option value="Blindagem de unhas">
                                Blindagem de unhas — 60 min — R$ 30,00
                            </option>

                            <option value="Alongamento de unhas">
                                Alongamento de unhas — 120 min — R$ 60,00
                            </option>

                            <option value="Plano mensal">
                                Plano mensal — 90 min — R$ 150,00
                            </option>

                        </select>

                    </div>



                    <!-- DATA -->

                    <div class="form-group">

                        <label for="data">
                            Data
                        </label>

                        <input
                            type="date"
                            id="data"
                            name="data"
                            required
                        >

                    </div>



                    <!-- HORÁRIO -->

                    <div class="form-group">

                        <label for="horario">
                            Horário
                        </label>

                        <select
                            id="horario"
                            name="horario"
                            required
                        >

                            <option value="">
                                Primeiro escolha uma data
                            </option>

                        </select>

                    </div>



                    <!-- OBSERVAÇÕES -->

                    <div class="form-group">

                        <label for="observacoes">

                            Observações

                            <span>
                                (opcional)
                            </span>

                        </label>

                        <textarea
                            id="observacoes"
                            name="observacoes"
                            rows="4"
                            placeholder="Alguma informação importante para o seu atendimento?"
                        ></textarea>

                    </div>



                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="btn btn-primary booking-button"
                    >
                        Confirmar agendamento
                    </button>


                    <p class="booking-notice">

                        Após o envio, você verá a confirmação
                        do seu agendamento.

                    </p>


                </form>

            </div>

        </section>

    </main>



    <!-- ==================================================
         RODAPÉ
         ================================================== -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Rayssa Lima Nail Designer
            </p>

        </div>

    </footer>



    <!-- ==================================================
         HORÁRIOS
         ================================================== -->

    <script>


        const dataInput =
            document.getElementById("data");


        const horarioSelect =
            document.getElementById("horario");


        const servicoSelect =
            document.getElementById("servico");



        /*
            DURAÇÃO DOS SERVIÇOS
        */

        const duracoes = {

            "Esmaltação simples": 30,

            "Esmaltação em Gel": 90,

            "Blindagem de unhas": 60,

            "Alongamento de unhas": 120,

            "Plano mensal": 90

        };



        /*
            CONVERTE HH:MM PARA MINUTOS
        */

        function paraMinutos(horario) {

            const [hora, minuto] =
                horario.split(":").map(Number);

            return hora * 60 + minuto;

        }



        /*
            CONVERTE MINUTOS PARA HH:MM
        */

        function paraHorario(minutos) {

            const hora =
                Math.floor(minutos / 60);

            const minuto =
                minutos % 60;

            return (
                String(hora).padStart(2, "0")
                + ":"
                + String(minuto).padStart(2, "0")
            );

        }



        /*
            CRIA OS HORÁRIOS DE UM PERÍODO
        */

        function criarHorarios(
            inicio,
            fim,
            duracao
        ) {

            const horarios = [];

            const inicioMinutos =
                paraMinutos(inicio);

            const fimMinutos =
                paraMinutos(fim);


            let atual =
                inicioMinutos;


            while (atual < fimMinutos) {

                const final =
                    atual + duracao;


                /*
                    O serviço precisa terminar
                    dentro do período de atendimento.
                */

                if (final <= fimMinutos) {

                    horarios.push(
                        paraHorario(atual)
                    );

                }


                atual += 30;

            }


            return horarios;

        }



        /*
            VERIFICA SE O SERVIÇO
            INTERSECTA UM BLOQUEIO
        */

        function horarioBloqueado(
            inicioHorario,
            duracao,
            bloqueio
        ) {

            const inicioAgendamento =
                paraMinutos(inicioHorario);


            const fimAgendamento =
                inicioAgendamento + duracao;


            const inicioBloqueio =
                paraMinutos(bloqueio.inicio);


            const fimBloqueio =
                paraMinutos(bloqueio.fim);


            /*
                Existe conflito quando:

                início do serviço < fim do bloqueio

                E

                fim do serviço > início do bloqueio
            */

            return (
                inicioAgendamento < fimBloqueio
                &&
                fimAgendamento > inicioBloqueio
            );

        }



        /*
            ATUALIZA OS HORÁRIOS DISPONÍVEIS
        */

        async function atualizarHorarios() {

            horarioSelect.innerHTML = "";


            /*
                VERIFICA DATA
            */

            if (!dataInput.value) {

                const option =
                    document.createElement("option");

                option.value = "";

                option.textContent =
                    "Primeiro escolha uma data";

                horarioSelect.appendChild(option);

                return;

            }



            /*
                VERIFICA SERVIÇO
            */

            const servico =
                servicoSelect.value;


            if (!servico) {

                const option =
                    document.createElement("option");

                option.value = "";

                option.textContent =
                    "Primeiro escolha o serviço";

                horarioSelect.appendChild(option);

                return;

            }



            const duracao =
                duracoes[servico];



            /*
                CRIA A DATA LOCAL
            */

            const partesData =
                dataInput.value
                    .split("-")
                    .map(Number);


            const data =
                new Date(
                    partesData[0],
                    partesData[1] - 1,
                    partesData[2]
                );


            const dia =
                data.getDay();



            /*
                PERÍODOS NORMAIS
            */

            let periodos = [];



            /*
                SEGUNDA, TERÇA,
                QUINTA E SEXTA
            */

            if (
                dia === 1 ||
                dia === 2 ||
                dia === 4 ||
                dia === 5
            ) {

                periodos = [

                    ["07:30", "11:00"],

                    ["13:30", "20:00"]

                ];

            }



            /*
                QUARTA-FEIRA
            */

            else if (dia === 3) {

                periodos = [

                    ["07:30", "11:00"],

                    ["13:30", "15:00"]

                ];

            }



            /*
                SÁBADO
            */

            else if (dia === 6) {

                periodos = [

                    ["09:00", "16:00"]

                ];

            }



            /*
                DOMINGO
            */

            else {

                const option =
                    document.createElement("option");

                option.value = "";

                option.textContent =
                    "Não há atendimento aos domingos";

                horarioSelect.appendChild(option);

                return;

            }



            /*
                BUSCA OS BLOQUEIOS
                DO POSTGRESQL
            */

            let bloqueios = [];


            try {

                const resposta =
                    await fetch(
                        `/bloqueios/${dataInput.value}?t=${Date.now()}`,
                        {
                            cache: "no-store"
                        }
                    );


                if (resposta.ok) {

                    const dados =
                        await resposta.json();


                    /*
                        GARANTE QUE O RETORNO
                        SEJA UMA LISTA
                    */

                    if (Array.isArray(dados)) {

                        bloqueios = dados;

                    }

                }

            }

            catch (erro) {

                console.error(
                    "Erro ao consultar bloqueios:",
                    erro
                );

            }



            /*
                CRIA TODOS OS HORÁRIOS
            */

            let horarios = [];


            periodos.forEach(
                periodo => {

                    const inicio =
                        periodo[0];

                    const fim =
                        periodo[1];


                    horarios.push(
                        ...criarHorarios(
                            inicio,
                            fim,
                            duracao
                        )
                    );

                }
            );



            /*
                REMOVE HORÁRIOS QUE
                CONFLITAM COM BLOQUEIOS
            */

            if (bloqueios.length > 0) {

                horarios =
                    horarios.filter(
                        horario => {

                            const existeConflito =
                                bloqueios.some(
                                    bloqueio => {

                                        /*
                                            Ignora registros
                                            antigos/inválidos.
                                        */

                                        if (
                                            !bloqueio.inicio
                                            ||
                                            !bloqueio.fim
                                        ) {

                                            return false;

                                        }


                                        return horarioBloqueado(
                                            horario,
                                            duracao,
                                            bloqueio
                                        );

                                    }
                                );


                            return !existeConflito;

                        }
                    );

            }



            /*
                REMOVE HORÁRIOS QUE
                JÁ PASSARAM HOJE
            */

            const hoje =
                new Date();


            const anoHoje =
                hoje.getFullYear();


            const mesHoje =
                String(
                    hoje.getMonth() + 1
                ).padStart(2, "0");


            const diaHoje =
                String(
                    hoje.getDate()
                ).padStart(2, "0");


            const dataHoje =
                `${anoHoje}-${mesHoje}-${diaHoje}`;


            if (
                dataInput.value === dataHoje
            ) {

                const minutosAgora =
                    hoje.getHours() * 60
                    + hoje.getMinutes();


                horarios =
                    horarios.filter(
                        horario => {

                            const minutosHorario =
                                paraMinutos(horario);


                            return (
                                minutosHorario
                                >=
                                minutosAgora
                            );

                        }
                    );

            }



            /*
                NENHUM HORÁRIO DISPONÍVEL
            */

            if (
                horarios.length === 0
            ) {

                const option =
                    document.createElement("option");

                option.value = "";

                option.textContent =
                    "Nenhum horário disponível";

                horarioSelect.appendChild(option);

                return;

            }



            /*
                PRIMEIRA OPÇÃO
            */

            const primeira =
                document.createElement("option");

            primeira.value = "";

            primeira.textContent =
                "Selecione o horário";

            horarioSelect.appendChild(
                primeira
            );



            /*
                MOSTRA OS HORÁRIOS
            */

            horarios.forEach(
                horario => {

                    const option =
                        document.createElement("option");

                    option.value =
                        horario;

                    option.textContent =
                        horario;

                    horarioSelect.appendChild(
                        option
                    );

                }
            );

        }



        /*
            QUANDO ALTERAR A DATA
        */

        dataInput.addEventListener(
            "change",
            atualizarHorarios
        );



        /*
            QUANDO ALTERAR O SERVIÇO
        */

        servicoSelect.addEventListener(
            "change",
            atualizarHorarios
        );



        /*
            IMPEDE ESCOLHER DATAS ANTERIORES
        */

        const hoje =
            new Date();


        const ano =
            hoje.getFullYear();


        const mes =
            String(
                hoje.getMonth() + 1
            ).padStart(2, "0");


        const dia =
            String(
                hoje.getDate()
            ).padStart(2, "0");


        dataInput.min =
            `${ano}-${mes}-${dia}`;


    </script>


</body>

</html>
