<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Painel | Rayssa Lima Nail Designer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header class="header">

        <div class="container header-content">

            <a href="/" class="logo">

                <span>Rayssa Lima</span>

                <small>Nail Designer</small>

            </a>


            <nav class="nav">

                <a href="/">
                    Site
                </a>

                <a href="/agendar">
                    Agendar
                </a>

            </nav>

        </div>

    </header>


    <main>

        <section class="booking-section">

            <div class="container booking-container">


                <!-- CABEÇALHO -->

                <div class="section-heading">

                    <span class="eyebrow">
                        Área administrativa
                    </span>

                    <h1>
                        Painel da Rayssa
                    </h1>

                    <p>
                        Acompanhe e organize seus atendimentos.
                    </p>

                </div>


                <!-- MENU ADMINISTRATIVO -->

                <div class="painel-opcoes">


                    <!-- AGENDAMENTOS -->

                    <a href="/admin/agendamentos"
                       class="painel-opcao">

                        <div class="painel-icone">
                            ♡
                        </div>

                        <div class="painel-conteudo">

                            <h2>
                                Agendamentos
                            </h2>

                            <p>
                                Clientes e serviços
                            </p>

                        </div>

                        <span class="painel-seta">
                            →
                        </span>

                    </a>



                    <!-- HORÁRIOS -->

                    <a href="#"
                       class="painel-opcao">

                        <div class="painel-icone">
                            ◷
                        </div>

                        <div class="painel-conteudo">

                            <h2>
                                Horários
                            </h2>

                            <p>
                                Gerenciar horários
                            </p>

                        </div>

                        <span class="painel-seta">
                            →
                        </span>

                    </a>


                </div>


            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Rayssa Lima Nail Designer
            </p>

        </div>

    </footer>



    <style>

        /* ==================================================
           MENU PRINCIPAL DO PAINEL
           ================================================== */

        .painel-opcoes {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 24px;

            max-width: 900px;

            margin: 55px auto 20px;

        }


        /* ==================================================
           CARTÃO
           ================================================== */

        .painel-opcao {

            position: relative;

            display: flex;

            align-items: center;

            gap: 22px;

            min-height: 190px;

            padding: 35px;

            background: rgba(255, 255, 255, 0.92);

            border: 1px solid
                rgba(143, 95, 103, 0.12);

            border-radius: 24px;

            box-shadow:
                0 15px 35px
                rgba(111, 74, 80, 0.08);

            text-decoration: none;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;

            box-sizing: border-box;

        }


        /* ==================================================
           EFEITO AO PASSAR O MOUSE
           ================================================== */

        .painel-opcao:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(143, 95, 103, 0.25);

            box-shadow:
                0 20px 40px
                rgba(111, 74, 80, 0.13);

        }


        /* ==================================================
           ÍCONE
           ================================================== */

        .painel-icone {

            flex-shrink: 0;

            width: 72px;

            height: 72px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                #f2e3e1;

            color:
                #8f5f67;

            font-family:
                Georgia,
                serif;

            font-size: 32px;

            line-height: 1;

        }


        /* ==================================================
           TEXTO
           ================================================== */

        .painel-conteudo {

            flex: 1;

        }


        .painel-conteudo h2 {

            margin: 0 0 8px;

            color:
                #4d3035;

            font-family:
                Georgia,
                serif;

            font-size: 25px;

            font-weight: 500;

            text-transform: capitalize;

        }


        .painel-conteudo p {

            margin: 0;

            color:
                #8f5f67;

            font-family:
                Arial,
                sans-serif;

            font-size: 12px;

            letter-spacing: 0.5px;

        }


        /* ==================================================
           SETA
           ================================================== */

        .painel-seta {

            flex-shrink: 0;

            color:
                #8f5f67;

            font-family:
                Georgia,
                serif;

            font-size: 25px;

            transition:
                transform 0.25s ease;

        }


        .painel-opcao:hover .painel-seta {

            transform:
                translateX(5px);

        }


        /* ==================================================
           CELULAR
           ================================================== */

        @media (max-width: 700px) {

            .painel-opcoes {

                grid-template-columns: 1fr;

                gap: 18px;

                margin-top: 40px;

            }


            .painel-opcao {

                min-height: 145px;

                padding: 25px;

            }


            .painel-icone {

                width: 60px;

                height: 60px;

                font-size: 27px;

            }


            .painel-conteudo h2 {

                font-size: 22px;

            }

        }

    </style>


</body>

</html>
